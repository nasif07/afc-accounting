name: alliance-accounting

# VPS-side compose file: pulls pre-built images from Docker Hub instead of
# building from source, so the VPS only needs this file, backend/.env.production,
# and (optionally) deploy/nginx/ — not the full git repo.
#
# Build + push from your dev machine with the root docker-compose.yml:
#   docker compose build
#   docker compose push
#
# Then on the VPS, with just this file present:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: alliance_accounting
    volumes:
      - mongo_data:/data/db
    networks:
      - accounts_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: nasi07/alliance-accounting-backend:latest
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "127.0.0.1:4802:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - accounts_net

  frontend:
    image: nasi07/alliance-accounting-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4800:80"
    networks:
      - accounts_net

networks:
  accounts_net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
