name: alliance-accounting

# VPS-side compose file: pulls pre-built images from Docker Hub instead of
# building from source, so the VPS only needs this file, backend/.env.production,
# and (optionally) deploy/nginx/ — not the full git repo.
#
# Build + push from your dev machine with the root docker-compose.yml:
#   docker compose build
#   docker compose push
#
# Then on the VPS, with just this file present:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  mongo:
    image: mongo:7
    # Fixed hostname so the replica set config's member address stays valid
    # across container recreation — without this, mongo's default hostname
    # is the container ID, which changes every time and breaks rs0.
    hostname: mongo
    restart: unless-stopped
    # --auth: this port is exposed publicly (see below), so the database
    # requires credentials. Do NOT add --auth until an admin user has been
    # created (see deploy notes) or you will lock yourself out.
    # --keyFile: required by mongod whenever --auth is combined with
    # --replSet, even for a single-member set — mongod refuses to start
    # without it. Generate with:
    #   openssl rand -base64 756 > mongo-keyfile
    #   chmod 400 mongo-keyfile && chown 999:999 mongo-keyfile
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo-keyfile"]
    env_file:
      - ./.env.production
    environment:
      MONGO_INITDB_DATABASE: alliance_accounting
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - accounts_net
    # Exposed on the public IP for Compass. MUST be paired with a VPS
    # firewall rule restricting this port to trusted IPs only (ufw allow
    # from <your-ip> to any port 27018 proto tcp) — auth alone isn't enough.
    ports:
      - "0.0.0.0:27018:27017"
    healthcheck:
      # Journal entries use multi-document transactions, which Mongo only
      # supports on a replica set (not a standalone mongod). This node runs
      # as a single-member replica set; on first boot rs.status() fails, so
      # we initiate it here with an explicit, stable member address —
      # subsequent checks just report status. Authenticates using the same
      # root credentials as the backend, read from .env.production.
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: nasi07/alliance-accounting-backend:latest
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "127.0.0.1:4802:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - accounts_net

  frontend:
    image: nasi07/alliance-accounting-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4800:80"
    networks:
      - accounts_net

networks:
  accounts_net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
