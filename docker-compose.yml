name: alliance-accounting

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: alliance_accounting
    volumes:
      - mongo_data:/data/db
    networks:
      - accounts_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - accounts_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - accounts_net

networks:
  accounts_net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
