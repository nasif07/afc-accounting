<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alliance Accounting System for managing accounts, journals, reports, and financial operations." />
    <!--
      Content-Security-Policy.

      connect-src MUST list the Cloudflare R2 endpoint. Approval attachments and
      the organisation logo are uploaded straight from the browser to R2 with a
      presigned PUT (frontend/src/utils/r2Upload.js) — the bytes never pass
      through our API, so 'self' plus the API origin is not enough. Without the
      R2 host here the browser blocks the request before it is sent: the XHR
      reports status 0 with no readable response, which is indistinguishable
      from an offline network or a bucket CORS problem unless you happen to be
      watching the console for the violation report.

      img-src needs the API origin and R2 for the same reason: GET
      /api/settings/logo answers with a redirect to a short-lived presigned URL
      on the R2 host, so both ends of that hop have to be allowed or the logo
      renders as a broken image.

      The wildcard is a suffix match under the CSP host-source grammar, so
      https://*.r2.cloudflarestorage.com covers both the account endpoint and
      the bucket's virtual host (afc-accounting.<account>.r2.cloudflarestorage.com).
      Scoped to R2 deliberately — it is not a blanket https: allowance, and it
      keeps this file free of the account id, which differs per environment.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:5000 https://afc-accounting-backend.vercel.app https://*.r2.cloudflarestorage.com; connect-src 'self' http://localhost:5000 https://afc-accounting-backend.vercel.app https://*.r2.cloudflarestorage.com;" />
    <link rel="icon" type="image/jpeg" href="/afc-logo.png" />
    <title>Alliance Accounting System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
